<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>javascript: 偽協議</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    pre { background: #f4f4f4; padding: .75rem; white-space: pre-wrap; word-break: break-all; }
    .box { border: 2px dashed #999; padding: 1rem; margin: 1rem 0; }
    a.demo { font-size: 1.1rem; }
  </style>
</head>
<body>
  <p><a href="./">← 回目錄</a></p>
  <h1>javascript: 偽協議</h1>

  <p>這一頁模擬「網站允許使用者控制連結網址」的情況，從網址參數 <code>url</code> 取出字串，直接放進 <code>&lt;a&gt;</code> 的 <code>href</code>。</p>

  <ul>
    <li>正常值：<a href="?url=https%3A%2F%2Fdeveloper.mozilla.org">https://developer.mozilla.org</a></li>
    <li>攻擊：<a href="?url=javascript%3Aalert(1)">javascript:alert(1)</a></li>
  </ul>

  <h2>沒有檢查協議（危險）</h2>
  <div class="box">
    <a class="demo" id="unsafe">查看內容</a>
    <p>點下去才會執行；<code>javascript:</code> 沒有 <code>&lt;</code>、<code>&gt;</code> 或引號，只做 HTML 編碼擋不住。</p>
  </div>

  <h2>只允許 http/https（安全）</h2>
  <div class="box">
    <a class="demo" id="safe">查看內容</a>
    <p id="safe-note"></p>
  </div>

  <h2>讀到的 href</h2>
  <pre id="output"></pre>

  <script nonce="demo">
    const url = new URLSearchParams(location.search).get('url') ?? '';

    // 沒有檢查：使用者給什麼就放什麼
    document.querySelector('#unsafe').setAttribute('href', url);

    // 有檢查：用 new URL() 解析，只放行 http / https
    const ALLOWED = ['http:', 'https:'];
    const safe = document.querySelector('#safe');
    const note = document.querySelector('#safe-note');
    let parsed = null;
    try {
      parsed = new URL(url, location.href);
    } catch {}

    if (parsed && ALLOWED.includes(parsed.protocol)) {
      safe.setAttribute('href', parsed.href);
      note.textContent = `協議是 ${parsed.protocol}，放行。`;
    } else {
      safe.setAttribute('href', '#');
      note.textContent = `協議不在允許清單，擋下來（原值：${url}）。`;
    }

    document.querySelector('#output').textContent =
      `unsafe → ${document.querySelector('#unsafe').getAttribute('href')}\n` +
      `safe   → ${safe.getAttribute('href')}`;
  </script>
</body>
</html>
